name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_DEPLOY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
      - name: Prepare Pages artifact
        run: |
          if [ "$GITHUB_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER.github.io" ]; then
            source_directory=".cloudflare/output/v0/workers/default/assets"
          else
            repository_name="${GITHUB_REPOSITORY#*/}"
            source_directory=".cloudflare/output/v0/workers/default/assets/$repository_name"
          fi
          test -f "$source_directory/index.html"
          mkdir -p pages-artifact
          cp -R "$source_directory"/. pages-artifact/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
